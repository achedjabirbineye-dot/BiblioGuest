{% extends 'base.html' %}
{% block title %}Connexion Bibliothécaire{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-white border-0 text-center pt-4">
                <div class="w-12 h-12 bg-primary-subtle text-primary rounded-circle d-inline-flex align-items-center justify-content-center p-3 mb-2">
                    <i class="bi bi-shield-lock fs-3"></i>
                </div>
                <h4 class="fw-bold text-dark">Connexion Guichet</h4>
                <p class="text-muted small">Accès réservé au personnel bibliothécaire</p>
            </div>

            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('auth.login_bibliothecaire') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold text-secondary small">
                            Adresse Email professionnelle
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" value="admin@biblio.ma" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="mot_de_passe" class="form-label fw-semibold text-secondary small">
                            Mot de passe
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="mot_de_passe" name="mot_de_passe" value="admin123" required>
                        </div>
                        <div class="form-text small">Compte démo : <code>admin@biblio.ma</code> / <code>admin123</code></div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="bi bi-box-arrow-in-right"></i> Se connecter au Back-Office
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
